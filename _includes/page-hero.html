<!-- Dunkler Titel-Header fuer Unterseiten (Berichte-Uebersicht, Impressum,
     Datenschutz). Erwartet page.hero_title (faellt auf page.title zurueck),
     optional page.hero_kicker und page.hero_intro. -->
<div class="page-hero">
  <div class="container page-hero__inner">
    {% if page.hero_kicker %}<p class="kicker kicker--light">{{ page.hero_kicker }}</p>{% endif %}
    <h1 class="page-hero__title">{{ page.hero_title | default: page.title }}</h1>
    {% if page.hero_intro %}<p class="page-hero__intro">{{ page.hero_intro }}</p>{% endif %}
  </div>
</div>
