# Sveltia CMS config (ADR 0003) -- absichtlich Decap-kompatibel gehalten,
# damit ein Rueckfall auf Decap CMS ein Ein-Zeilen-Change bleibt
# (nur admin/index.html muesste das <script>-Tag tauschen).

backend:
  name: github
  repo: hollesse/sharkey-divers.de
  branch: main
  base_url: https://sveltia-cms-auth.soft-bush-cd2b.workers.dev

# Kein Editorial Workflow in v1 (ADR 0003) -- Redakteure committen direkt auf main.

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Bildoptimierung beim Upload (ADR 0005): Sveltia transformiert automatisch
# nach WebP, max. 1600px Kantenlaenge, Qualitaet ~80.
# Sveltia-eigene Syntax (media_libraries, Transformations unter "all") --
# die alte Decap-Form media_library ohne "name" scheitert an Sveltias
# Config-Validierung. Bewusste Abweichung von der Decap-Kompatibilitaet:
# Decap kennt dieses Feature ohnehin nicht und ignoriert unbekannte Keys.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 80
        width: 1600
        height: 1600

collections:
  - name: berichte
    label: "Berichte"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    # Unterordner pro Tauchbericht (ADR 0005): Uploads landen unter
    # assets/uploads/<slug> statt in einem gemeinsamen Ordner.
    media_folder: "/assets/uploads/{{slug}}"
    public_folder: "/assets/uploads/{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime" }
      # Kurztext fuer Berichte-Karten (Startseite-Vorschau, Uebersicht),
      # Theme-Ergaenzung design-system-001.
      - { label: "Teaser", name: "teaser", widget: "text", required: false }
      - { label: "Text", name: "body", widget: "markdown" }
      # "Feldtyp" Bild-mit-Quelle: Sveltia unterstuetzt registerFieldType
      # noch nicht (Stand 09/2026, sveltia-cms#709), daher als YAML-Anker —
      # hier einmal definiert, ueberall per Alias *bild_mit_quelle_felder
      # wiederverwendet. Struktur: Bild + Alt-Text, Quelle/Copyright als
      # optionales Unter-Objekt ("Foto: <Fotograf> / <Plattform>", Fotograf
      # verlinkt aufs Profil, Plattform-Wort aufs Foto, Overlay unten
      # rechts). Jekyll-Gegenstueck: _includes/bild-mit-quelle.html.
      - label: "Titelbild"
        name: "titelbild"
        widget: "object"
        required: false
        fields: &bild_mit_quelle_felder
          - { label: "Bild", name: "src", widget: "image" }
          - { label: "Alt-Text", name: "alt", widget: "string", hint: "Kurze Bildbeschreibung fuer Screenreader, z. B. \"Taucherin schwimmt ueber ein Riff\"." }
          - label: "Quelle"
            name: "quelle"
            widget: "object"
            required: false
            fields:
              - { label: "Fotograf", name: "fotograf", widget: "string", required: false }
              - { label: "Fotograf-Link", name: "fotograf_url", widget: "string", required: false }
              - { label: "Foto-Link", name: "foto_url", widget: "string", required: false }
              - { label: "Plattform", name: "plattform", widget: "string", required: false, default: "Unsplash" }
      - label: "Galerie"
        name: "images"
        widget: "list"
        required: false
        fields: *bild_mit_quelle_felder

  # Konfigseite fuer die Berichte-Bereiche (Uebersichtsseiten-Kopf,
  # Startseiten-Vorschau, Banner unter jedem Bericht).
  - name: berichte_einstellungen
    label: "Berichte: Einstellungen"
    files:
      - label: "Berichte-Einstellungen"
        name: "berichte"
        file: "_data/berichte.yml"
        fields:
          - label: "Uebersichtsseite (Kopf von /berichte)"
            name: "uebersicht"
            widget: "object"
            fields:
              - { label: "Kicker (kleine Zeile ueber dem Titel)", name: "kicker", widget: "string" }
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Vorschau auf der Startseite"
            name: "startseite"
            widget: "object"
            fields:
              - { label: "Kicker (kleine Zeile ueber dem Titel)", name: "kicker", widget: "string" }
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Link-Text zur Uebersicht", name: "link_text", widget: "string" }
              - { label: "Anzahl Berichte", name: "anzahl", widget: "number", value_type: "int", min: 1, max: 6, default: 3, hint: "Wie viele der neuesten Berichte auf der Startseite erscheinen." }
          - label: "Banner unter jedem Bericht"
            name: "banner"
            widget: "object"
            fields:
              - { label: "Text (fett)", name: "text_fett", widget: "string" }
              - { label: "Text", name: "text", widget: "string" }
              - { label: "Button-Beschriftung", name: "button_label", widget: "string" }
              - { label: "Button-Link", name: "button_link", widget: "string", hint: "z. B. /#mitmachen fuer den Mitmachen-Bereich der Startseite." }

  # Termine als eigene Collection (_termine/, je Termin eine Datei) — werden
  # haeufiger gepflegt als der Rest der Startseite. Angezeigt in der
  # Startseiten-Sektion "Termine" (dort auch der Aktiv-Schalter).
  - name: termine
    label: "Termine"
    folder: "_termine"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{datum}} — {{title}}"
    sortable_fields: [datum, title]
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "datum", widget: "datetime", time_format: false, format: "YYYY-MM-DD", hint: "Vergangene Termine verschwinden nicht automatisch — bitte gelegentlich aufraeumen." }
      - { label: "Info", name: "info", widget: "string", hint: "Kurze Zusatzinfo, z. B. Uhrzeit und Ort." }

  # Startseiten-Sektionen als je eigene Daten-Datei (_data/startseite/*.yml,
  # Jekyll mappt den Ordner auf site.data.startseite.<name>). Jede Sektion
  # erscheint im CMS als eigener Eintrag der Sammlung "Startseite"; weitere
  # Sektionen (Ausbildung, Termine, CTA) sollen hier nach und nach folgen.
  - name: startseite
    label: "Startseite"
    files:
      - label: "Herobanner"
        name: "hero"
        file: "_data/startseite/hero.yml"
        # Bild-Uploads der Startseite landen in einem eigenen Unterordner.
        media_folder: "/assets/uploads/startseite"
        public_folder: "/assets/uploads/startseite"
        fields:
          - { label: "Kicker (kleine Zeile ueber dem Titel)", name: "kicker", widget: "string" }
          - { label: "Titel", name: "titel", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }
          - label: "Bild"
            name: "bild"
            widget: "object"
            fields: *bild_mit_quelle_felder
          - label: "Button (primaer)"
            name: "button_primaer"
            widget: "object"
            fields:
              - { label: "Beschriftung", name: "label", widget: "string" }
              - { label: "Link", name: "link", widget: "string", hint: "Anker auf der Startseite (z. B. #mitmachen) oder URL." }
          - label: "Button (sekundaer)"
            name: "button_sekundaer"
            widget: "object"
            required: false
            fields:
              - { label: "Beschriftung", name: "label", widget: "string", required: false }
              - { label: "Link", name: "link", widget: "string", required: false }
      - label: "Der Verein"
        name: "verein"
        file: "_data/startseite/verein.yml"
        media_folder: "/assets/uploads/startseite"
        public_folder: "/assets/uploads/startseite"
        fields:
          - { label: "Kicker (kleine Zeile ueber dem Titel)", name: "kicker", widget: "string" }
          - { label: "Titel", name: "titel", widget: "string" }
          - { label: "Text", name: "text", widget: "markdown", hint: "Absaetze durch Leerzeile trennen, Links im Text sind moeglich." }
          - label: "Grosses Bild"
            name: "bild_gross"
            widget: "object"
            fields: *bild_mit_quelle_felder
          - label: "Kleine Bilder"
            name: "bilder_klein"
            widget: "list"
            min: 2
            max: 2
            hint: "Genau zwei Bilder, zweispaltig unter dem grossen Bild."
            fields: *bild_mit_quelle_felder
          - label: "Feature-Karten"
            name: "features"
            widget: "list"
            min: 2
            max: 4
            hint: "Zwei bis vier Karten, nebeneinander unter der Vereins-Vorstellung."
            fields:
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
      - label: "Ausbildung"
        name: "ausbildung"
        file: "_data/startseite/ausbildung.yml"
        media_folder: "/assets/uploads/startseite"
        public_folder: "/assets/uploads/startseite"
        fields:
          - { label: "Kicker (kleine Zeile ueber dem Titel)", name: "kicker", widget: "string" }
          - { label: "Titel", name: "titel", widget: "string" }
          - { label: "Text", name: "text", widget: "markdown", hint: "Links im Text sind moeglich, z. B. auf #mitmachen." }
          - label: "Feature-Karten"
            name: "features"
            widget: "list"
            hint: "Beliebig viele Karten, untereinander unter dem Text."
            fields:
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Bild"
            name: "bild"
            widget: "object"
            fields: *bild_mit_quelle_felder
      - label: "Termine"
        name: "termine"
        file: "_data/startseite/termine.yml"
        fields:
          - { label: "Sektion aktiv", name: "aktiv", widget: "boolean", default: true, hint: "Aus = Sektion, Navbar- und Footer-Menuepunkt werden ausgeblendet. Die Termine selbst bleiben in der Sammlung 'Termine' erhalten." }
          - { label: "Kicker (kleine Zeile ueber dem Titel)", name: "kicker", widget: "string" }
          - { label: "Titel", name: "titel", widget: "string" }
      - label: "Mitmachen (CTA-Box)"
        name: "cta"
        file: "_data/startseite/cta.yml"
        fields:
          - { label: "Titel", name: "titel", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }
          - { label: "E-Mail-Adresse", name: "email", widget: "string", hint: "Wird als Button angezeigt und als mailto-Link verlinkt." }
          - { label: "Hinweis unter dem Button", name: "hinweis", widget: "string", required: false }
      - label: "Footer"
        name: "footer"
        file: "_data/startseite/footer.yml"
        fields:
          - { label: "Adresse", name: "adresse", widget: "text", hint: "Mehrzeilig, Zeilenumbrueche werden uebernommen." }
          - label: "Verbaende"
            name: "verbaende"
            widget: "list"
            required: false
            hint: "Link-Liste in der Spalte 'Verbaende'; leer = Spalte wird ausgeblendet."
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Link", name: "url", widget: "string" }
          - { label: "Copyright-Name", name: "copyright_name", widget: "string", hint: "Erscheint hinter der automatischen Jahreszahl, auch im schlanken Footer der Unterseiten." }

  - name: pages
    label: "Seiten"
    files:
      - label: "Impressum"
        name: "impressum"
        file: "impressum.md"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
      - label: "Datenschutz"
        name: "datenschutz"
        file: "datenschutz.md"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
