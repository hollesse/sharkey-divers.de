# Sveltia CMS config (ADR 0003) -- absichtlich Decap-kompatibel gehalten,
# damit ein Rueckfall auf Decap CMS ein Ein-Zeilen-Change bleibt
# (nur admin/index.html muesste das <script>-Tag tauschen).

backend:
  name: github
  repo: hollesse/sharkey-divers.de
  branch: main
  base_url: https://sveltia-cms-auth.soft-bush-cd2b.workers.dev

# Kein Editorial Workflow in v1 (ADR 0003) -- Redakteure committen direkt auf main.

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Bildoptimierung beim Upload (ADR 0005): Sveltia transformiert automatisch
# nach WebP, max. 1600px Kantenlaenge, Qualitaet ~80.
# Sveltia-eigene Syntax (media_libraries, Transformations unter "all") --
# die alte Decap-Form media_library ohne "name" scheitert an Sveltias
# Config-Validierung. Bewusste Abweichung von der Decap-Kompatibilitaet:
# Decap kennt dieses Feature ohnehin nicht und ignoriert unbekannte Keys.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 80
        width: 1600
        height: 1600

collections:
  - name: berichte
    label: "Berichte"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    # Unterordner pro Tauchbericht (ADR 0005): Uploads landen unter
    # assets/uploads/<slug> statt in einem gemeinsamen Ordner.
    media_folder: "/assets/uploads/{{slug}}"
    public_folder: "/assets/uploads/{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime" }
      # Kurztext fuer Berichte-Karten (Startseite-Vorschau, Uebersicht),
      # Theme-Ergaenzung design-system-001.
      - { label: "Teaser", name: "teaser", widget: "text", required: false }
      - { label: "Text", name: "body", widget: "markdown" }
      # "Feldtyp" Bild-mit-Quelle: Sveltia unterstuetzt registerFieldType
      # noch nicht (Stand 09/2026, sveltia-cms#709), daher als YAML-Anker —
      # hier einmal definiert, ueberall per Alias *bild_mit_quelle_felder
      # wiederverwendet. Struktur: Bild + Alt-Text, Quelle/Copyright als
      # optionales Unter-Objekt ("Foto: <Fotograf> / <Plattform>", Fotograf
      # verlinkt aufs Profil, Plattform-Wort aufs Foto, Overlay unten
      # rechts). Jekyll-Gegenstueck: _includes/bild-mit-quelle.html.
      - label: "Titelbild"
        name: "titelbild"
        widget: "object"
        required: false
        fields: &bild_mit_quelle_felder
          - { label: "Bild", name: "src", widget: "image" }
          - { label: "Alt-Text", name: "alt", widget: "string", hint: "Kurze Bildbeschreibung fuer Screenreader, z. B. \"Taucherin schwimmt ueber ein Riff\"." }
          - label: "Quelle"
            name: "quelle"
            widget: "object"
            required: false
            fields:
              - { label: "Fotograf", name: "fotograf", widget: "string", required: false }
              - { label: "Fotograf-Link", name: "fotograf_url", widget: "string", required: false }
              - { label: "Foto-Link", name: "foto_url", widget: "string", required: false }
              - { label: "Plattform", name: "plattform", widget: "string", required: false, default: "Unsplash" }
      - label: "Galerie"
        name: "images"
        widget: "list"
        required: false
        fields: *bild_mit_quelle_felder

  # Startseiten-Sektionen als je eigene Daten-Datei (_data/startseite/*.yml,
  # Jekyll mappt den Ordner auf site.data.startseite.<name>). Jede Sektion
  # erscheint im CMS als eigener Eintrag der Sammlung "Startseite"; weitere
  # Sektionen (Ausbildung, Termine, CTA) sollen hier nach und nach folgen.
  - name: startseite
    label: "Startseite"
    files:
      - label: "Herobanner"
        name: "hero"
        file: "_data/startseite/hero.yml"
        # Bild-Uploads der Startseite landen in einem eigenen Unterordner.
        media_folder: "/assets/uploads/startseite"
        public_folder: "/assets/uploads/startseite"
        fields:
          - { label: "Kicker (kleine Zeile ueber dem Titel)", name: "kicker", widget: "string" }
          - { label: "Titel", name: "titel", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }
          - label: "Bild"
            name: "bild"
            widget: "object"
            fields: *bild_mit_quelle_felder
          - label: "Button (primaer)"
            name: "button_primaer"
            widget: "object"
            fields:
              - { label: "Beschriftung", name: "label", widget: "string" }
              - { label: "Link", name: "link", widget: "string", hint: "Anker auf der Startseite (z. B. #mitmachen) oder URL." }
          - label: "Button (sekundaer)"
            name: "button_sekundaer"
            widget: "object"
            required: false
            fields:
              - { label: "Beschriftung", name: "label", widget: "string", required: false }
              - { label: "Link", name: "link", widget: "string", required: false }
      - label: "Der Verein"
        name: "verein"
        file: "_data/startseite/verein.yml"
        media_folder: "/assets/uploads/startseite"
        public_folder: "/assets/uploads/startseite"
        fields:
          - { label: "Kicker (kleine Zeile ueber dem Titel)", name: "kicker", widget: "string" }
          - { label: "Titel", name: "titel", widget: "string" }
          - { label: "Text", name: "text", widget: "markdown", hint: "Absaetze durch Leerzeile trennen, Links im Text sind moeglich." }
          - label: "Grosses Bild"
            name: "bild_gross"
            widget: "object"
            fields: *bild_mit_quelle_felder
          - label: "Kleine Bilder"
            name: "bilder_klein"
            widget: "list"
            min: 2
            max: 2
            hint: "Genau zwei Bilder, zweispaltig unter dem grossen Bild."
            fields: *bild_mit_quelle_felder
          - label: "Feature-Karten"
            name: "features"
            widget: "list"
            min: 3
            max: 3
            hint: "Genau drei Karten, nebeneinander unter der Vereins-Vorstellung."
            fields:
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

  - name: pages
    label: "Seiten"
    files:
      - label: "Impressum"
        name: "impressum"
        file: "impressum.md"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
      - label: "Datenschutz"
        name: "datenschutz"
        file: "datenschutz.md"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
