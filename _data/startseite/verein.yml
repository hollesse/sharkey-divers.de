    text: "Flaschenfüllungen zum Vorzugspreis, direkt im Verein, ohne Umweg über den Tauchshop."
  - titel: "Gemeinsam tauchen"
    text: "Regelmäßig zusammen im Verbandssee in Schönbach und an den Seen der Umgebung. Keiner taucht allein."
  - titel: "Ausfahrten & Reisen"
    text: "Wochenenden an heimischen Seen, Clubreisen ans Meer. Gemeinsam macht's mehr Spaß."
