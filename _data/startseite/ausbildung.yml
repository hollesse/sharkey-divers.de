kicker: "Ausbildung"
titel: "Tauchen lernen. Bei uns im Verein."
text: |
  Nicht jeder Verein hat eigene Tauchlehrer, wir schon. Ausgebildet wird im Verbandssee in Schönbach bei Herborn, nach den Richtlinien des VDST und damit nach weltweit anerkannten CMAS-Standards. Zu fairen Vereinskonditionen, im eigenen Tempo, von Leuten, mit denen du danach auch tauchen gehst. Interesse? [Frag ein Schnuppertauchen an](#mitmachen), der Rest ergibt sich.
features:
  - titel: "Vereinseigene Tauchlehrer"
    text: "Ausbildung aus dem Verein heraus, vom Schnuppertauchen bis zum Brevet"
  - titel: "VDST/CMAS-Brevets"
    text: "Vom Grundtauchschein über die Sterne-Brevets bis zu Spezialkursen"
  - titel: "Kostenlose Leihausrüstung"
    text: "Für die Ausbildung stellt der Verein die komplette Ausrüstung, Neumitglieder leihen kostenlos"
