title: "Sharky Divers Weilburg (Skeleton)"
description: "Walking Skeleton: Jekyll + Sveltia CMS + GitHub Actions Deploy."

# Preview-Phase (ADR 0002 / ADR 0006): Seite lebt vorerst unter der
# persoenlichen *.github.io-Adresse mit noindex/robots.txt. Beim
# DNS-Cutover wird url auf "https://sharkey-divers.de" und baseurl auf ""
# umgestellt (ADR 0006).
url: "https://hollesse.github.io"
baseurl: "/sharkey-divers.de"

timezone: Europe/Berlin

markdown: kramdown

# Jekyll-eigene Sass-Pipeline (kein zusaetzliches Gem noetig, ships mit
# Jekyll 4). Tokens/Layouts/Komponenten liegen als Partials unter _sass/,
# Einstiegspunkt ist assets/css/main.scss.
sass:
  style: compressed

collections:
  posts:
    output: true
    permalink: /berichte/:year/:month/:day/:title/
  # Termine als eigene Collection (je Termin eine Datei unter _termine/),
  # gepflegt via Sveltia CMS. Keine eigenen Seiten, nur Daten fuer die
  # Startseiten-Sektion.
  termine:
    output: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      # Schlanke Footer-Variante auf allen Bericht-Detailseiten (Theme-
      # Entscheidung design-system-001, siehe Clot-Prototyp bericht.html).
      footer_slim: true
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - .agentheim
  - .worktrees
  - vendor
  - docs
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
