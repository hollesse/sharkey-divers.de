<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <!-- Preview-Phase (ADR 0002/0006): noindex, solange die Seite nur unter
       der *.github.io-Adresse laeuft. Wird beim DNS-Cutover entfernt. -->
  <meta name="robots" content="noindex, nofollow">
  <!-- ADR 0007: keine Third-Party-Requests im Auslieferungspfad. Fonts und
       Styles sind first-party unter assets/ ausgeliefert. -->
  {%- comment %} Cache-Busting: der Build-Zeitstempel als Query-Parameter
      sorgt dafuer, dass Browser nach jedem Deploy das frische CSS laden
      statt einer gecachten Version. {% endcomment %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <!-- First-party Scroll-Spy fuer die Startseiten-Nav (ADR 0007: kein CDN) -->
  <script src="{{ '/assets/js/nav-active.js' | relative_url }}" defer></script>
</body>
</html>
